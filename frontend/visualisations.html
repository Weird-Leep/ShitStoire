<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShitStoire - Visualisations</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme-retrowave.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/visualisations.css">
    
    <!-- Vis.js Timeline CSS -->
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

</head>
<body>
    <div id="custom-tooltip"></div>
    <header>
        <h1>ShitStoire - Extractions & Visualisations</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="visualisations.html" class="active">Visualisations</a></li>
                <li><a href="admin.html">Administration</a></li>
            </ul>
        </nav>
    </header>
    <main>
        
        

        <div class="vis-nav">
            <button onclick="showVis('timeline')">Frise Temporelle</button>
            <button onclick="showVis('sequential')">Frise Séquentielle</button>
            <button onclick="showVis('carte')">Carte Interactive</button>
            <button onclick="showVis('reseau')">Réseau Dynamique</button>
        </div>

        <!-- SECTION: TIMELINE -->
        <section id="vis-timeline" class="vis-section active">
            <h2>Frise Temporelle</h2>
            
            <div class="filters-container">
                <label>Afficher :</label>
                <label><input type="checkbox" id="check-ev" checked onchange="reloadTimeline()"> Évènements</label>
                <label><input type="checkbox" id="check-pe" checked onchange="reloadTimeline()"> Personnages</label>
                <label><input type="checkbox" id="check-ep" checked onchange="reloadTimeline()"> Entités Politiques</label>
                <button onclick="fitTimeline()">Recentrer la frise</button>
            </div>

            <div class="timeline-filter-panel">
                <div class="timeline-filter-panel-header">
                    <h3>Filtres avancés de la frise</h3>
                    <div class="timeline-filter-panel-actions">
                        <button type="button" onclick="addTimelineFilter()">Ajouter un filtre</button>
                        <button type="button" onclick="clearTimelineFilters()">Vider les filtres</button>
                    </div>
                </div>
                <div id="timeline-filter-list" class="timeline-filter-list"></div>
            </div>

            <!-- Vis.js Timeline Container -->
            <div id="timeline-container"></div>
        </section>

        <!-- SECTION: SEQUENTIAL -->
        <section id="vis-sequential" class="vis-section">
            <h2>Frise Séquentielle</h2>
            
            <div class="filters-container">
                <label>Afficher :</label>
                <label><input type="checkbox" id="seq-check-ev" checked onchange="reloadSequential()"> Évènements</label>
                <label><input type="checkbox" id="seq-check-pe" checked onchange="reloadSequential()"> Personnages</label>
                <label><input type="checkbox" id="seq-check-ep" checked onchange="reloadSequential()"> Entités Politiques</label>
            </div>

            <!-- Sequential Container -->
            <div id="sequential-container">
                <!-- Javascript will generate items here -->
            </div>
        </section>

        <!-- (Other sections will be implemented next) -->
        <section id="vis-carte" class="vis-section">
            <h2>Carte des Lieux & Évènements</h2>
            <div id="map-container"></div>
        </section>
        
        <!-- SECTION: RESEAU NETWORK -->
        <section id="vis-reseau" class="vis-section">
            <h2>Graphe des Connexions</h2>
            <div class="filters-container">
                <label>Filtrer les Noeuds :</label>
                <label><input type="checkbox" id="net-check-ev" checked onchange="loadNetworkData()"> Évènements</label>
                <label><input type="checkbox" id="net-check-pe" checked onchange="loadNetworkData()"> Personnages</label>
                <label><input type="checkbox" id="net-check-li" checked onchange="loadNetworkData()"> Lieux</label>
                <label><input type="checkbox" id="net-check-ep" checked onchange="loadNetworkData()"> Entités Pol.</label>
            </div>
            <div id="network-container"></div>
        </section>

    </main>

    <!-- External Libraries Scripts -->
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/tooltip.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/sequential.js"></script>
    <script src="js/map.js"></script>
    <script src="js/network.js"></script>
    <script>
        function showVis(id) {
            document.querySelectorAll('.vis-section').forEach(el => el.classList.remove('active'));
            document.getElementById('vis-' + id).classList.add('active');
            
            if(id === 'sequential' && typeof renderSequential === 'function') {
                renderSequential();
            }
            if(id === 'carte' && typeof initOrRefreshMap === 'function') {
                initOrRefreshMap();
            }
            if(id === 'reseau' && typeof initNetwork === 'function') {
                initNetwork();
            }
        }
    </script>
</body>
</html>
