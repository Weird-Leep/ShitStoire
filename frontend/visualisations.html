<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShitStoire - Visualisations</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme-retrowave.css">
    
    <!-- Tabulator CSS (Vanilla JS DataTables equivalent) -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
    
    <!-- Vis.js Timeline CSS -->
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        .vis-nav { margin-bottom: 20px; display: flex; gap: 10px; }
        .vis-nav button { padding: 10px; cursor: pointer; }
        .vis-section { display: none; }
        .vis-section.active { display: block; }
        
        /* Tableur styles */
        .filters-container { margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 3px 8px; margin: 2px; background: #007bff; color: white; border-radius: 12px; font-size: 0.8em; }

        /* Custom Tooltip */
        #custom-tooltip {
            display: none;
            position: absolute;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 350px;
            pointer-events: none; /* Let mouse pass through */
            font-size: 0.9em;
        }
        #custom-tooltip h4 { margin: 0 0 8px 0; color: #333; }
        #custom-tooltip .tt-dates { font-size: 0.85em; color: #666; margin-bottom: 8px; font-style: italic; }
        #custom-tooltip .tt-desc { margin-bottom: 10px; line-height: 1.4; }
        #custom-tooltip .tt-links ul { margin: 5px 0 0 15px; padding: 0; }
        #custom-tooltip .tt-links li { margin-bottom: 3px; }

        /* Sequential Timeline Styles */
        #sequential-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 20px 10px;
            border: 1px solid lightgray;
            background: white;
            min-height: 300px;
            align-items: center;
        }
        .seq-item {
            flex: 0 0 auto;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ccc;
            min-width: 150px;
            max-width: 250px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .seq-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .seq-item-event { background-color: #d1ecf1; border-color: #bee5eb; }
        .seq-item-person { background-color: #fff3cd; border-color: #ffeeba; }
        .seq-item-politics { background-color: #f8d7da; border-color: #f5c6cb; }
        .seq-date { font-size: 0.8em; color: #555; margin-bottom: 5px; }
        .seq-title { font-weight: bold; white-space: normal; } /* allow text wrap */
        .seq-arrow {
            flex: 0 0 auto;
            color: #999;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div id="custom-tooltip"></div>
    <header>
        <h1>ShitStoire - Extractions & Visualisations</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="visualisations.html" class="active">Visualisations</a></li>
                <li><a href="admin.html">Administration</a></li>
            </ul>
        </nav>
    </header>
    <main>
        
        

        <div class="vis-nav">
            <button onclick="showVis('tableur')">Tableur Dynamique</button>
            <button onclick="showVis('timeline')">Frise Temporelle</button>
            <button onclick="showVis('sequential')">Frise Séquentielle</button>
            <button onclick="showVis('carte')">Carte Interactive</button>
            <button onclick="showVis('reseau')">Réseau Dynamique</button>
        </div>

        <!-- SECTION: TABLEUR -->
        <section id="vis-tableur" class="vis-section active">
            <h2>Tableur de la Base de Données</h2>            <div class="vis-link-filters filters-container" style="background: #eef2f5;"></div>            
            <!-- Global filters -->
            <div class="filters-container">
                <label>Filtres globaux :</label>
                <select id="filter-entity" onchange="loadTableData()">
                    <option value="Evenement" selected>Évènements</option>
                    <option value="Personnages">Personnages</option>
                    <option value="Lieu">Lieux</option>
                    <option value="Entite_politique">Entités Politiques</option>
                </select>
                <input type="text" id="filter-text" placeholder="Rechercher (titre, description...)" onkeyup="applyFilters()">
                <button onclick="clearFilters()">Réinitialiser les filtres</button>
            </div>

            <!-- Validation/Table container for Tabulator -->
            <div id="data-table"></div>
        </section>

        <!-- SECTION: TIMELINE -->
        <section id="vis-timeline" class="vis-section">
            <h2>Frise Temporelle</h2>
            <div class="vis-link-filters filters-container" style="background: #eef2f5;"></div>
            
            <div class="filters-container">
                <label>Afficher :</label>
                <label><input type="checkbox" id="check-ev" checked onchange="reloadTimeline()"> Évènements</label>
                <label><input type="checkbox" id="check-pe" checked onchange="reloadTimeline()"> Personnages</label>
                <label><input type="checkbox" id="check-ep" checked onchange="reloadTimeline()"> Entités Politiques</label>
                <button onclick="timelineInstance.fit()">Recentrer la frise</button>
            </div>

            <!-- Vis.js Timeline Container -->
            <div id="timeline-container" style="height: 600px; border: 1px solid lightgray;"></div>
        </section>

        <!-- SECTION: SEQUENTIAL -->
        <section id="vis-sequential" class="vis-section">
            <h2>Frise Séquentielle</h2>
            <div class="vis-link-filters filters-container" style="background: #eef2f5;"></div>
            
            <div class="filters-container">
                <label>Afficher :</label>
                <label><input type="checkbox" id="seq-check-ev" checked onchange="reloadSequential()"> Évènements</label>
                <label><input type="checkbox" id="seq-check-pe" checked onchange="reloadSequential()"> Personnages</label>
                <label><input type="checkbox" id="seq-check-ep" checked onchange="reloadSequential()"> Entités Politiques</label>
            </div>

            <!-- Sequential Container -->
            <div id="sequential-container">
                <!-- Javascript will generate items here -->
            </div>
        </section>

        <!-- (Other sections will be implemented next) -->
        <section id="vis-carte" class="vis-section">
            <h2>Carte des Lieux & Évènements</h2>            <div class="vis-link-filters filters-container" style="background: #eef2f5;"></div>            <div id="map-container" style="height: 600px; border: 1px solid lightgray; z-index: 1;"></div>
        </section>
        
        <!-- SECTION: RESEAU NETWORK -->
        <section id="vis-reseau" class="vis-section">
            <h2>Graphe des Connexions</h2>
            <div class="vis-link-filters filters-container" style="background: #eef2f5;"></div>
            <div class="filters-container">
                <label>Filtrer les Noeuds :</label>
                <label><input type="checkbox" id="net-check-ev" checked onchange="loadNetworkData()"> Évènements</label>
                <label><input type="checkbox" id="net-check-pe" checked onchange="loadNetworkData()"> Personnages</label>
                <label><input type="checkbox" id="net-check-li" checked onchange="loadNetworkData()"> Lieux</label>
                <label><input type="checkbox" id="net-check-ep" checked onchange="loadNetworkData()"> Entités Pol.</label>
            </div>
            <div id="network-container" style="height: 700px; border: 1px solid lightgray; background: white;"></div>
        </section>

    </main>

    <!-- External Libraries Scripts -->
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/filters.js"></script>
    <script src="js/tableur.js"></script>
    <script src="js/tooltip.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/sequential.js"></script>
    <script src="js/map.js"></script>
    <script src="js/network.js"></script>
    <script>
        function showVis(id) {
            document.querySelectorAll('.vis-section').forEach(el => el.classList.remove('active'));
            document.getElementById('vis-' + id).classList.add('active');
            
            if(id === 'sequential' && typeof renderSequential === 'function') {
                renderSequential();
            }
            if(id === 'carte' && typeof initOrRefreshMap === 'function') {
                initOrRefreshMap();
            }
            if(id === 'reseau' && typeof initNetwork === 'function') {
                initNetwork();
            }
        }
    </script>
</body>
</html>
